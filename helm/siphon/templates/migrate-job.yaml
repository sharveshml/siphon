apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "siphon.fullname" . }}-migrate
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "siphon.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ .Values.migrate.image.repository | default (printf "%s/siphon-migrate-svc" .Values.image.registry | trimPrefix "/") }}:{{ .Values.migrate.image.tag | default .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "siphon.fullname" . }}
                  key: database-url
