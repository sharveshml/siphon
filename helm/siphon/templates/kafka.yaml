{{- if .Values.kafka.enabled }}
{{- $fullname := include "siphon.fullname" . }}
{{- $podHost := printf "%s-kafka-0.%s-kafka" $fullname $fullname }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-kafka
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "siphon.selectorLabels" (dict "root" . "component" "kafka") | nindent 4 }}
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-kafka
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ $fullname }}-kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "siphon.selectorLabels" (dict "root" . "component" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "siphon.selectorLabels" (dict "root" . "component" "kafka") | nindent 8 }}
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: {{ printf "PLAINTEXT://%s:9092" $podHost }}
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: {{ printf "1@%s:9093" $podHost }}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.kafka.storageClassName }}
        storageClassName: {{ .Values.kafka.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}
