apiVersion: v1
kind: Service
metadata:
  name: {{ include "siphon.fullname" . }}-api-gateway
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  selector:
    {{- include "siphon.selectorLabels" (dict "root" . "component" "api-gateway") | nindent 4 }}
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "siphon.fullname" . }}-api-gateway
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "siphon.selectorLabels" (dict "root" . "component" "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "siphon.selectorLabels" (dict "root" . "component" "api-gateway") | nindent 8 }}
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.apiGateway.image.repository | default (printf "%s/siphon-api-gateway" .Values.image.registry | trimPrefix "/") }}:{{ .Values.apiGateway.image.tag | default .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: PORT
              value: {{ .Values.apiGateway.port | quote }}
            - name: AUTH_SVC_URL
              value: {{ printf "http://%s-auth-svc:%d" (include "siphon.fullname" .) (.Values.authSvc.port | int) | quote }}
            - name: INGESTION_SVC_URL
              value: {{ printf "%s-ingestion-svc:%d" (include "siphon.fullname" .) (.Values.ingestionSvc.port | int) | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "siphon.fullname" . }}
                  key: jwt-secret
            - name: REDIS_ADDR
              value: {{ ternary (printf "%s-redis:6379" (include "siphon.fullname" .)) .Values.external.redisAddr .Values.redis.enabled | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
