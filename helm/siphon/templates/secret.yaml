apiVersion: v1
kind: Secret
metadata:
  name: {{ include "siphon.fullname" . }}
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  resend-api-key: {{ .Values.secrets.resendApiKey | quote }}
  from-email: {{ .Values.secrets.fromEmail | quote }}
  database-url: {{ .Values.secrets.databaseUrl | default .Values.external.databaseUrl | quote }}
