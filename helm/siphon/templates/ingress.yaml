{{- if .Values.apiGateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "siphon.fullname" . }}-api-gateway
  labels:
    {{- include "siphon.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
  {{- with .Values.apiGateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.apiGateway.ingress.className }}
  ingressClassName: {{ .Values.apiGateway.ingress.className }}
  {{- end }}
  {{- if .Values.apiGateway.ingress.tls }}
  tls:
    {{- toYaml .Values.apiGateway.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.apiGateway.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "siphon.fullname" . }}-api-gateway
                port:
                  number: {{ .Values.apiGateway.port }}
{{- end }}
